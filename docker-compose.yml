services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dentro do container não há perfil da CLI: use DATABRICKS_TOKEN no .env
      DATABRICKS_CONFIG_PROFILE: ""
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
