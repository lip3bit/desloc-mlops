server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Encaminha a API para o container do backend
    # Resolver do Docker: resolve "backend" em tempo de requisição,
    # permitindo que o nginx suba mesmo antes do backend estar disponível.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cold start do Model Serving (scale-to-zero) pode demorar
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Arquivos estáticos com hash: cache longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
