[project]
name = "desloc-backend"
version = "1.0.0"
description = "API FastAPI do simulador de preço de corridas DESLOC"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]
